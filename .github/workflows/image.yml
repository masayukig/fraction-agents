# The images: the generic host (ghcr.io/yuanying/fraction-agents), the web researcher's, which adds a browser
# (ghcr.io/yuanying/fraction-agents-web-researcher, the Dockerfile's web-researcher target), and the news agent's,
# which adds the page reader (ghcr.io/yuanying/fraction-agents-news-agent, the news-agent target), and the deep
# researcher's, which adds the page reader and fd (ghcr.io/yuanying/fraction-agents-deep-researcher, the
# deep-researcher target). A tag v<version> pushes all of them as <version>; a pull request only builds them.
name: image

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fraction-agents
            target: host
          - image: fraction-agents-web-researcher
            target: web-researcher
          - image: fraction-agents-news-agent
            target: news-agent
          - image: fraction-agents-deep-researcher
            target: deep-researcher
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Name the image
        id: name
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=ghcr.io/yuanying/${IMAGE}:${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${IMAGE}:pr" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
